name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs of the same branch / PR when a new push lands.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast lane: typecheck + Node-only unit tests. Always required.
  # Catches IR / parser / emitter / route regressions in <60s.
  fast:
    name: typecheck + unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install api deps
        working-directory: api
        # Lockfiles are gitignored (.gitignore line "bun.lock*"); drop
        # --frozen-lockfile until that decision is revisited.
        run: bun install

      - name: typecheck
        working-directory: api
        run: bun run typecheck

      - name: unit tests (no cargo)
        working-directory: api
        # Excludes cargo-build / realworld-cargo / sandbox-rce — those need
        # the cargo toolchain + sandbox tooling and run in the cargo job.
        run: |
          bun test \
            tests/api.test.ts \
            tests/constraint-splitter.test.ts \
            tests/emitter-validation.test.ts \
            tests/emitter-snapshots.test.ts \
            tests/inliner.test.ts \
            tests/parser-snapshots.test.ts \
            tests/parser-timeout.test.ts \
            tests/spend-tracker.test.ts

  # Cargo lane: real `cargo check` against emitted output. This is the
  # gate that catches "the IR changed and now real Anchor doesn't compile."
  # Required — a regression here means user-facing breakage.
  cargo:
    name: MUST_PASS cargo regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          # Solana programs target wasm-friendly stable; no edition-specific
          # nightly needed for `cargo check` on the scratch projects.

      - name: install firejail (sandbox)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y firejail
          firejail --version | head -1

      - name: cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('api/src/build/build-runner.ts') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: cache anvil scratch target dir
        uses: actions/cache@v4
        with:
          path: ~/.anvil-build
          key: anvil-scratch-${{ runner.os }}-${{ hashFiles('api/src/build/build-runner.ts') }}
          restore-keys: |
            anvil-scratch-${{ runner.os }}-

      - name: install api deps
        working-directory: api
        # Lockfiles are gitignored (.gitignore line "bun.lock*"); drop
        # --frozen-lockfile until that decision is revisited.
        run: bun install

      - name: sandbox + cargo-build tests (curated demos)
        working-directory: api
        env:
          # Force firejail in CI so the sandbox-rce.test asserts the strict
          # path, not the unshare fallback.
          ANVIL_SANDBOX: firejail
        run: |
          bun test tests/sandbox-rce.test.ts
          bun test tests/cargo-build.test.ts --timeout 600000

      - name: realworld MUST_PASS regression suite
        working-directory: api
        env:
          ANVIL_SANDBOX: firejail
        # 18 program-examples × 2 targets + escrow2025 + coral fixtures = 43
        # cargo-green gates. Auto-clones source repos to /tmp on first run.
        run: bun test tests/realworld-cargo.test.ts --timeout 1800000

      - name: tracking-ceiling tests (non-blocking informational)
        working-directory: api
        env:
          ANVIL_SANDBOX: firejail
        # These have known error ceilings (coral-swap, t22-extension fixtures).
        # We DO want CI visibility — a worse number means real regression.
        run: bun test tests/realworld-tracking.test.ts --timeout 1800000
