name: CI

# Typecheck-only gate.
#
# The heavy `test-full` lane (Agave + Anchor + the byte-equal differential
# corpus) was removed: on GitHub's runners it is disk-bound and kept failing for
# infra reasons (ENOSPC — ~200 SBF builds exhaust the runner disk), which is red
# noise, not signal. A flaky lane is worse than none. With the backend retiring
# and the CLI as the durable product, the corpus is run LOCALLY while iterating
# (bun test tests/ with TMPDIR on a large disk); this workflow keeps only the
# cheap, reliable per-push type gate.
#
# To restore full-corpus CI later, re-add a `test-full` job on a runner with
# adequate disk (self-hosted or a larger runner) — the problem was resources,
# not the tests.

on:
  push:
    branches: [main, "harden/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (api, tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install api deps
        working-directory: api
        run: bun install --frozen-lockfile
      - name: tsc --noEmit
        working-directory: api
        run: bun run typecheck
