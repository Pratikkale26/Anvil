name: CI

# Committed CI (task #3, restructured #20-followup). The prior "no committed
# CI" state made the README/trust-doc "locked on every commit / CI fails on
# regression" claim false; this is a real gate.
#
# Three lanes, matched to cost:
#   1. typecheck   — api `tsc --noEmit`. Seconds. Runs on everything.
#   2. test-fast   — host Rust + the toolchain-free `test:fast` subset (unit +
#                    parse/emit/validate). Minutes. Runs on everything. This is
#                    the per-push gate.
#   3. test-full   — Agave + Anchor + the FULL suite incl. the byte-equal
#                    differential corpus. Tens of minutes + heavy disk/CPU.
#                    Runs ONLY on PRs to main, nightly, and manual dispatch —
#                    NOT on every harden/** push, where it was pure noise.
#
# Why not run the corpus on every push: it builds dozens of real SBF + Anchor
# programs, which is too slow and too resource-bound to gate feature-branch
# work. It belongs before a merge to main and on a nightly cadence, where a red
# is worth stopping for.

on:
  push:
    branches: [main, "harden/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * *" # nightly ~07:00 UTC — full differential corpus
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (api, tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install api deps
        working-directory: api
        run: bun install --frozen-lockfile
      - name: tsc --noEmit
        working-directory: api
        run: bun run typecheck

  test-fast:
    name: Fast tests (unit + parse/emit/validate, no SBF/Anchor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Host Rust only — some emit tests run a plain `cargo check`. This is the
      # cheap toolchain (~seconds), NOT the SBF/Anchor stack (minutes to build).
      - uses: dtolnay/rust-toolchain@stable
      - name: Install api deps
        working-directory: api
        run: bun install --frozen-lockfile
      - name: test:fast (excludes differential / realworld / cargo-build-sbf)
        working-directory: api
        # Point scratch at the workspace disk — /tmp is a small tmpfs on some
        # runners and the emit tests write cargo scratch there.
        env:
          TMPDIR: ${{ runner.temp }}
        run: bun run test:fast

  test-full:
    name: Full suite + differential corpus (SBF + Anchor required)
    runs-on: ubuntu-latest
    # Heavy: PRs to main, nightly, and manual only — never on a harden/** push.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Agave (provides cargo-build-sbf)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor CLI via avm (the harness needs anchor + SBF)
        # Pinned to the 0.31 line the fixtures target. Compiling avm + anchor is
        # why this lane is slow; tune the version to match the corpus.
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.31.1
          avm use 0.31.1
      - name: HARD-FAIL if the SBF/anchor toolchain is missing
        # differential-harness.ts skips silently when cargo-build-sbf OR anchor
        # is absent, which turns a missing toolchain into a green "0 differential
        # tests" — the exact false-confidence #3 removes. Fail loud instead.
        run: |
          fail=0
          for tool in cargo-build-sbf anchor; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool not on PATH — the differential corpus cannot run."
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
          cargo-build-sbf --version
          anchor --version
      - name: Install api deps
        working-directory: api
        run: bun install --frozen-lockfile
      - name: Full suite (unit + differential corpus)
        working-directory: api
        # /tmp is a small tmpfs on some runners; point cargo scratch at the
        # workspace disk so large SBF builds don't hit ENOSPC.
        env:
          TMPDIR: ${{ runner.temp }}
        run: bun test tests/
